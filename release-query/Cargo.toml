[workspace]
members = ["crates/releasequery-core", "crates/releasequery-cli", "crates/releasequery-lakebridge"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

[workspace.dependencies]
arrow = { version = "=58.4.0", features = ["prettyprint"] }
parquet = { version = "=58.4.0", features = ["arrow", "async"] }
datafusion = { version = "=53.1.0", default-features = false, features = ["parquet"] }
iceberg = "=0.10.0"
iceberg-datafusion = "=0.10.1"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "signal", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
