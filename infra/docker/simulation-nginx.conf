worker_processes 2;
events { worker_connections 4096; }
http {
    upstream minio_backend {
        server minio:9000;
        keepalive 256;
        keepalive_requests 10000;
    }
    log_format s3 escape=json '{"time":$msec,"method":"$request_method","uri":"$uri","args":"$args","status":$status,"request_bytes":$request_length,"body_sent_bytes":$body_bytes_sent,"sent_bytes":$bytes_sent,"request_seconds":$request_time}';
    access_log /logs/s3-access.jsonl s3;
    server {
        listen 9000;
        client_max_body_size 0;
        location / {
            proxy_pass http://minio_backend;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
