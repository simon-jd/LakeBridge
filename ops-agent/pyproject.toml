[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lakebridge-ops-agent"
version = "0.1.0"
description = "Bounded release investigation over LakeBridge business MCP tools"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mcp>=2,<3",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.2"]

[project.scripts]
lakebridge-ops = "lakebridge_ops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lakebridge_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
