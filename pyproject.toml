[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lakebridge"
version = "0.1.0"
description = "Auditable Parquet to Iceberg migration, backfill, release and recovery lab"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pyspark==3.5.9",
  "pyarrow==19.0.1",
  "duckdb==1.2.2",
  "psycopg[binary]==3.2.6",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.2", "jsonschema==4.23.0"]
consumer = ["fastapi==0.141.1", "uvicorn==0.52.4", "httpx==0.28.1"]

[project.scripts]
lakebridge = "lakebridge.cli:main"
lakebridge-consumer = "lakebridge.consumer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lakebridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: real Spark and Iceberg integration tests",
  "postgres: real PostgreSQL concurrency and recovery tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
